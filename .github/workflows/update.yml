# עדכונים מהערכה: פעם בשבוע (ובלחיצה) בודק אם יצאה גרסה חדשה של הערכה,
# ואם כן פותח בקשת שינוי (Pull Request) בריפו שלך. שום דבר לא משתנה עד שלוחצים Merge.
# ההדרכה: docs/update.md
name: עדכון מהערכה

on:
  schedule:
    - cron: "0 6 * * 0" # יום ראשון, 09:00 בישראל
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # לא רץ בריפו של הערכה עצמה, רק בעותקים של הלקוחות.
    if: github.repository != 'roshilabs-hq/telegram-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ניסיון קודם שנכשל (למשל לפני שאופשר ל-Actions לפתוח בקשות שינוי) משאיר ענף בלי בקשה פתוחה,
      # ואז הפעולה מדלגת בשקט עד הגרסה הבאה. מוחקים ענפים כאלה לפני שמתחילים.
      - name: ניקוי ענף שנשאר מניסיון שנכשל
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in $(git ls-remote --heads origin 'chore/template_sync_*' | sed 's#.*refs/heads/##'); do
            if [ -z "$(gh pr list --head "$b" --state open --json number -q '.[].number')" ]; then
              git push origin --delete "$b"
            fi
          done
      - uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860 # v2.6.0
        with:
          source_repo_path: roshilabs-hq/telegram-assistant
          upstream_branch: main
          pr_title: "🔄 עדכון לבוט מהערכה"
          pr_labels: template_sync
          pr_body: |
            יצאה גרסה חדשה של הערכה. מה השתנה: CHANGELOG.md.
            כדי לעדכן את הבוט: לוחצים למטה **Merge pull request** ואז **Confirm merge** (לא Squash).
            Vercel מעלה את הגרסה החדשה תוך דקה או שתיים. אחר כך נכנסים לעמוד ההקמה (/setup) ולוחצים "הפעילו הכול".
