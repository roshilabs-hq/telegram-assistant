# עדכון מהערכה: פעם בשבוע, ומיד כשמוסיפים את הקובץ. רק גרסה עם תג חתום במפתח שכאן.
# העדכון לא מחליף את הקובץ הזה. ההסבר: addons/05-updates.md
name: עדכון מהערכה
on:
  schedule: [{ cron: "0 6 * * 0" }]
  workflow_dispatch:
  push: { paths: [".github/workflows/update.yml"] }
permissions: { contents: write }
jobs:
  update:
    if: github.repository != 'roshilabs-hq/telegram-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - env:
          KIT: https://github.com/roshilabs-hq/telegram-assistant.git
          KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILXXvvg51kM9xN+5gRNBJ31+rq2zoDYB3wln3MREU5qF
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -e
          export MINE=$(jq -r .version package.json)
          TAG=$(git ls-remote --tags --refs $KIT 'v*' | sed 's#.*/##' | sort -V | tail -1)
          export LATEST=${TAG#v}
          [ -n "$TAG" ] && [ "$(printf '%s\n' $MINE $LATEST | sort -V | tail -1)" != "$MINE" ] || { echo "מעודכן ($MINE)"; exit 0; }
          git clone -q --depth 1 -b $TAG $KIT /tmp/kit
          echo "kit $KEY" > /tmp/signers
          git -C /tmp/kit -c gpg.ssh.allowedSignersFile=/tmp/signers verify-tag $TAG
          [ "$(jq -r .version /tmp/kit/package.json)" = "$LATEST" ]
          bash /tmp/kit/scripts/update.sh
