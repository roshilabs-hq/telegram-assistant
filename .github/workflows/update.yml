# עדכונים מהערכה: פעם בשבוע (ומיד כשמוסיפים את הקובץ) בודק אם יצאה גרסה חדשה וחתומה של הערכה,
# ואם כן מכניס אותה לבד: הבדיקות של הערכה רצות קודם, ורק אם הן עוברות הקוד נדחף ו-Vercel מעלה את הבוט.
# שינית את הקוד בעצמך (למשל עם Claude Code)? העדכון לא נוגע בו, ועמוד ההקמה ממשיך להראות "יש גרסה חדשה".
# ההדרכה: docs/browser.md#עדכונים-אוטומטיים
name: עדכון מהערכה

on:
  schedule:
    - cron: "0 6 * * 0" # יום ראשון, 09:00 בישראל
  workflow_dispatch:
  # רץ מיד כשמוסיפים את הקובץ הזה, כדי שהעדכון יגיע בלי לחכות ליום ראשון.
  push:
    paths: [".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  update:
    # לא רץ בריפו של הערכה עצמה, רק בעותקים של הלקוחות.
    if: github.repository != 'roshilabs-hq/telegram-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: עדכון לגרסה האחרונה
        env:
          KIT: https://github.com/roshilabs-hq/telegram-assistant.git
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          SIGNER: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILXXvvg51kM9xN+5gRNBJ31+rq2zoDYB3wln3MREU5qF
        run: |
          set -e
          mine=$(node -p "require('./package.json').version")
          # רק גרסה עם תג חתום במפתח של הערכה. מי שמשתלט על הריפו של הערכה לא יכול לחתום,
          # והמפתח הציבורי יושב כאן, בקובץ שהעדכון עצמו לא מחליף.
          tag=$(git ls-remote --tags --refs "$KIT" 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          latest=${tag#v}
          newer=$(node -e "const [a,b]=process.argv.slice(1).map(v=>v.split('.').map(Number));let r=0;for(let i=0;i<3&&!r;i++)r=Math.sign((a[i]||0)-(b[i]||0));console.log(r>0)" "$latest" "$mine")
          if [ -z "$tag" ] || [ "$newer" != true ]; then echo "מעודכן (גרסה $mine)."; exit 0; fi
          git clone -q --depth 1 --branch "$tag" "$KIT" /tmp/kit
          echo "release $SIGNER" > /tmp/allowed_signers
          git -C /tmp/kit -c gpg.ssh.allowedSignersFile=/tmp/allowed_signers verify-tag "$tag"             || { echo "::error::התג $tag לא חתום במפתח של הערכה. לא מעדכנים."; exit 1; }
          [ "$(node -p "require('/tmp/kit/package.json').version")" = "$latest" ]             || { echo "::error::הגרסה בתג $tag לא תואמת ל-package.json. לא מעדכנים."; exit 1; }

          # שינוי של אדם: קומיט שאינו הראשון (העותק ש-Vercel יצר), אינו של כלי העדכון, ונוגע במשהו מחוץ ל-.github.
          root=$(git rev-list --max-parents=0 HEAD | tail -1)
          for c in $(git rev-list --no-merges "$root"..HEAD); do
            case "$(git log -1 --format=%ce "$c")" in *github-actions*|*actions-template-sync*) continue ;; esac
            if git diff-tree --no-commit-id --name-only -r "$c" | grep -qv '^\.github/'; then
              echo "::warning::שינית את הקוד של הבוט בעצמך (קומיט $c), ולכן העדכון לגרסה $latest לא נכנס לבד. עם Claude Code כותבים: תעדכן את הבוט מהערכה."
              exit 0
            fi
          done

          rsync -a --delete --exclude .git --exclude .github/workflows --exclude .github/ISSUE_TEMPLATE --exclude '.env*' /tmp/kit/ ./
          npm ci --no-audit --no-fund
          npm test
          rm -rf node_modules

          # הכותב הוא בעל הריפו, כי Vercel בחשבון החינמי מעלה רק קוד של בעל החשבון.
          # המבצע הוא github-actions, וכך הבדיקה למעלה יודעת שזה עדכון ולא שינוי של אדם.
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "🔄 עדכון מהערכה: $mine ← $latest" --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>"
          git push origin HEAD
          echo "עודכן לגרסה $latest. Vercel מעלה את הבוט תוך דקה או שתיים."
